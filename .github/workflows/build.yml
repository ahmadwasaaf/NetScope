# Builds NetScope.exe and NetScope-Setup.exe on GitHub's Windows machines.
# - Every push: the files are attached to the run (Actions tab -> run -> Artifacts).
# - Publishing a release (or pushing a tag like v1.0.1) attaches them to that release.
name: Build NetScope

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Core regression tests (saved routers, router DNS setup/undo, DNS helper)
        run: python -u tests/test_core.py

      - name: UI smoke test (demo router, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: python -u tests/smoke_ui.py


      - name: Version from the release tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v(\d+(\.\d+)*)$') {
            $v = $Matches[1]
            (Get-Content netscope/__init__.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$v`"" | Set-Content netscope/__init__.py
            "APP_VERSION=$v" >> $env:GITHUB_ENV
          } else {
            $cur = (Select-String -Path netscope/__init__.py -Pattern 'APP_VERSION = "(.*)"').Matches[0].Groups[1].Value
            "APP_VERSION=$cur" >> $env:GITHUB_ENV
          }
          Get-Content netscope/__init__.py

      - name: Build NetScope.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name NetScope --icon icon.ico --add-data "icon.ico;."
          --collect-submodules netscope
          --collect-all tplinkrouterc6u
          --collect-submodules keyring --copy-metadata keyring
          --hidden-import keyring.backends.Windows
          main.py

      - name: Build NetScope-Setup.exe
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\NetScope.iss

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NetScope-windows
          retention-days: 3
          path: |
            dist/NetScope.exe
            dist/NetScope-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetScope.exe
            dist/NetScope-Setup.exe
